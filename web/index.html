<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Voice Agent — Call Console</title>
<style>
  :root {
    --bg: #0f1220;
    --card: #1a1e30;
    --text: #e8eaf2;
    --muted: #9aa0b4;
    --line: #2b3048;
    --accent: #4f7cff;
    --green: #22c55e;
    --green-press: #16a34a;
    --red: #ef4444;
    --red-press: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: radial-gradient(1200px 600px at 50% -10%, #1c2136, var(--bg));
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    width: min(92vw, 380px);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 28px 26px 30px;
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
    text-align: center;
  }
  h1 { margin: 0 0 4px; font-size: 18px; font-weight: 650; }
  .sub { margin: 0 0 22px; color: var(--muted); font-size: 13px; }

  label { display: block; text-align: left; font-size: 12px; color: var(--muted); margin: 0 0 6px; }
  input {
    width: 100%;
    padding: 12px 14px;
    font-size: 16px;
    letter-spacing: .5px;
    color: var(--text);
    background: #12162a;
    border: 1px solid var(--line);
    border-radius: 12px;
    outline: none;
    text-align: center;
  }
  input:focus { border-color: var(--accent); }
  input:disabled { opacity: .55; }

  .dial {
    margin: 26px auto 10px;
    width: 84px; height: 84px;
    border: none;
    border-radius: 50%;
    display: grid;
    place-items: center;
    cursor: pointer;
    background: var(--green);
    color: #fff;
    transition: transform .12s ease, background .2s ease, box-shadow .2s ease;
    box-shadow: 0 10px 24px rgba(34,197,94,.35);
  }
  .dial:hover { transform: translateY(-1px); }
  .dial:active { transform: scale(.96); background: var(--green-press); }
  .dial svg { width: 34px; height: 34px; }

  .dial.is-active {
    background: var(--red);
    box-shadow: 0 10px 24px rgba(239,68,68,.4);
    animation: pulse 1.6s ease-out infinite;
  }
  .dial.is-active:active { background: var(--red-press); }
  .dial.is-busy { pointer-events: none; opacity: .8; }

  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(239,68,68,.45); }
    70%  { box-shadow: 0 0 0 18px rgba(239,68,68,0); }
    100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); }
  }

  .status {
    margin-top: 12px;
    min-height: 20px;
    font-size: 13px;
    color: var(--muted);
  }
  .status.err { color: #fca5a5; }
  .status .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: currentColor; margin-right: 7px; vertical-align: middle;
  }
  .hint { margin-top: 18px; font-size: 11px; color: #6b7188; }
</style>
</head>
<body>
  <div class="card">
    <h1>Voice Agent</h1>
    <p class="sub">Click to call — the agent dials and talks.</p>

    <label for="num">Number to call</label>
    <input id="num" inputmode="tel" autocomplete="off" placeholder="0740525967" />

    <button id="dial" class="dial" aria-label="Call">
      <svg id="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.5.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.5.1.4 0 .8-.2 1L6.6 10.8z"/>
      </svg>
    </button>

    <div id="status" class="status"></div>
    <div class="hint">Needs <code>python agent.py dev</code> running.</div>
  </div>

<script>
  const dial = document.getElementById("dial");
  const icon = document.getElementById("icon");
  const numInput = document.getElementById("num");
  const statusEl = document.getElementById("status");

  const PHONE_PATH = "M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.5.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.5.1.4 0 .8-.2 1L6.6 10.8z";
  const HANGUP_PATH = "M12 9c-1.6 0-3.15.25-4.6.7v3.1c0 .5-.3.94-.74 1.14-.9.42-1.73.96-2.48 1.6-.2.18-.47.28-.75.28-.3 0-.58-.12-.78-.32L.3 14.25a1.1 1.1 0 0 1-.3-.76c0-.3.12-.58.32-.78C3.4 9.85 7.5 8.25 12 8.25s8.6 1.6 11.68 4.46c.2.2.32.48.32.78 0 .3-.12.57-.32.77l-1.6 1.6c-.2.2-.48.32-.78.32-.28 0-.55-.1-.75-.28a11.6 11.6 0 0 0-2.48-1.6 1.27 1.27 0 0 1-.74-1.14V9.7C15.15 9.25 13.6 9 12 9z";

  let state = "idle";      // idle | starting | in-call
  let room = null;
  let poll = null;

  const DIAL_TEXT = {
    connecting: "Connecting the agent…",
    ringing: "Ringing…",
    active: "In call",
  };

  function setStatus(text, isErr) {
    statusEl.className = "status" + (isErr ? " err" : "");
    statusEl.innerHTML = text ? `<span class="dot"></span>${text}` : "";
  }

  function render() {
    if (state === "idle") {
      dial.classList.remove("is-active", "is-busy");
      icon.querySelector("path").setAttribute("d", PHONE_PATH);
      dial.setAttribute("aria-label", "Call");
      numInput.disabled = false;
    } else if (state === "starting") {
      dial.classList.add("is-busy");
      numInput.disabled = true;
    } else {
      dial.classList.remove("is-busy");
      dial.classList.add("is-active");
      icon.querySelector("path").setAttribute("d", HANGUP_PATH);
      dial.setAttribute("aria-label", "Hang up");
      numInput.disabled = true;
    }
  }

  async function startCall() {
    state = "starting"; render(); setStatus("Starting call…");
    try {
      const r = await fetch("/api/call", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ number: numInput.value.trim() }),
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || "call failed");
      room = data.room;
      state = "in-call"; render();
      setStatus("Connecting the agent…");
      poll = setInterval(checkStatus, 1500);
    } catch (e) {
      state = "idle"; render();
      setStatus(e.message || "Could not start the call", true);
    }
  }

  async function checkStatus() {
    if (!room) return;
    try {
      const r = await fetch("/api/status?room=" + encodeURIComponent(room));
      const data = await r.json();
      if (data.state === "ended") { endCall(false); return; }
      setStatus(DIAL_TEXT[data.state] || "In progress…");
    } catch { /* transient */ }
  }

  async function hangup() {
    setStatus("Ending…");
    try {
      await fetch("/api/hangup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ room }),
      });
    } catch { /* ignore */ }
    endCall(true);
  }

  function endCall(byUser) {
    clearInterval(poll); poll = null;
    room = null;
    state = "idle"; render();
    setStatus(byUser ? "Call ended." : "Call finished.");
  }

  dial.addEventListener("click", () => {
    if (state === "idle") startCall();
    else if (state === "in-call") hangup();
  });

  numInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && state === "idle") startCall();
  });

  fetch("/api/config")
    .then((r) => r.json())
    .then((c) => { numInput.value = c.default_number || ""; })
    .catch(() => {});
  render();
</script>
</body>
</html>
